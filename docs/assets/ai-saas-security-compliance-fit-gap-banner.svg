<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title description">
  <title id="title">AI SaaS Security and Compliance Fit-Gap</title>
  <desc id="description">Evidence-driven security engineering with fail-closed validation, fit-gap assessment, and remediation flow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1b2d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8fb8d8" stroke-opacity="0.045"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="500" rx="24" fill="url(#background)"/>
  <rect width="1600" height="500" rx="24" fill="url(#grid)"/>
  <path d="M0 420C330 360 470 510 810 432S1280 330 1600 395V500H0Z" fill="#0e4261" opacity="0.13"/>
  <circle cx="1260" cy="122" r="180" fill="#20b8d8" opacity="0.045" filter="url(#softGlow)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(92 78)">
      <rect width="510" height="34" rx="17" fill="#102a40" stroke="#2c637e"/>
      <circle cx="20" cy="17" r="5" fill="#5ee0bd"/>
      <text x="36" y="22" fill="#b8d3e5" font-size="15" font-weight="650" letter-spacing="1.8">SECURITY ENGINEERING · EVIDENCE · GOVERNANCE</text>

      <text x="0" y="105" fill="#f4f8fb" font-size="58" font-weight="720" letter-spacing="-1.7">AI SaaS Security</text>
      <text x="0" y="171" fill="#f4f8fb" font-size="58" font-weight="720" letter-spacing="-1.7">&amp; Compliance Fit-Gap</text>
      <text x="0" y="225" fill="#a9c3d6" font-size="24" font-weight="420">Evidence-driven fit-gap analysis with fail-closed validation.</text>

      <g transform="translate(0 280)">
        <path d="M0 0H410" stroke="#24465d"/>
        <g transform="translate(0 27)" fill="#8fb2c9" font-size="16" font-weight="560">
          <circle cx="5" cy="-5" r="4" fill="#52c7df"/>
          <text x="18">Traceable evidence</text>
          <circle cx="176" cy="-5" r="4" fill="#5ee0bd"/>
          <text x="189">Bounded claims</text>
          <circle cx="336" cy="-5" r="4" fill="#f2ba69"/>
          <text x="349">Explicit gaps</text>
        </g>
      </g>
    </g>

    <g transform="translate(850 84)">
      <rect width="650" height="332" rx="22" fill="#091624" stroke="#27465d"/>
      <text x="34" y="42" fill="#7899ae" font-size="14" font-weight="650" letter-spacing="1.6">EVIDENCE TO DECISION</text>

      <path d="M108 123H196M300 123H388M492 123H536" fill="none" stroke="#3c7896" stroke-width="2" stroke-dasharray="5 7"/>
      <path d="M190 117L198 123L190 129M382 117L390 123L382 129M530 117L538 123L530 129" fill="none" stroke="#55b9d5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(34 78)">
        <rect width="120" height="90" rx="14" fill="#10283b" stroke="#34708d"/>
        <circle cx="25" cy="27" r="9" fill="none" stroke="#52c7df" stroke-width="2"/>
        <path d="M25 20V28L31 32" fill="none" stroke="#52c7df" stroke-width="2" stroke-linecap="round"/>
        <text x="18" y="63" fill="#e5f1f7" font-size="17" font-weight="650">Evidence</text>
        <text x="18" y="81" fill="#7899ae" font-size="12">records · origin</text>
      </g>

      <g transform="translate(226 78)">
        <rect width="120" height="90" rx="14" fill="#10283b" stroke="#34708d"/>
        <path d="M18 26L24 32L35 20" fill="none" stroke="#5ee0bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="18" y="63" fill="#e5f1f7" font-size="17" font-weight="650">Validate</text>
        <text x="18" y="81" fill="#7899ae" font-size="12">fail closed</text>
      </g>

      <g transform="translate(418 78)">
        <rect width="120" height="90" rx="14" fill="#10283b" stroke="#34708d"/>
        <path d="M18 20H38M18 27H33M18 34H28" stroke="#f2ba69" stroke-width="2" stroke-linecap="round"/>
        <text x="18" y="63" fill="#e5f1f7" font-size="17" font-weight="650">Assess</text>
        <text x="18" y="81" fill="#7899ae" font-size="12">fit · gap · risk</text>
      </g>

      <g transform="translate(566 78)">
        <rect width="50" height="90" rx="14" fill="#10283b" stroke="#34708d"/>
        <path d="M16 28H34M29 23L34 28L29 33" fill="none" stroke="#5ee0bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="25" y="68" fill="#b8d3e5" font-size="13" font-weight="700" text-anchor="middle">ACT</text>
      </g>

      <g transform="translate(34 210)">
        <text x="0" y="16" fill="#7899ae" font-size="13" font-weight="650" letter-spacing="1.2">EVIDENCE STATE</text>
        <g transform="translate(0 36)">
          <rect width="172" height="50" rx="10" fill="#0d2334" stroke="#31586f"/>
          <circle cx="22" cy="25" r="6" fill="#5ee0bd"/>
          <path d="M19 25L21 27L26 21" fill="none" stroke="#07111f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="39" y="30" fill="#c8dce8" font-size="15" font-weight="600">SUFFICIENT</text>
        </g>
        <g transform="translate(190 36)">
          <rect width="172" height="50" rx="10" fill="#0d2334" stroke="#31586f"/>
          <circle cx="22" cy="25" r="6" fill="#f2ba69"/>
          <path d="M19 25H25" stroke="#07111f" stroke-width="1.7" stroke-linecap="round"/>
          <text x="39" y="30" fill="#c8dce8" font-size="15" font-weight="600">PARTIAL</text>
        </g>
        <g transform="translate(380 36)">
          <rect width="172" height="50" rx="10" fill="#0d2334" stroke="#31586f"/>
          <circle cx="22" cy="25" r="6" fill="none" stroke="#8fa8b8" stroke-width="2"/>
          <text x="39" y="30" fill="#c8dce8" font-size="15" font-weight="600">GAP</text>
        </g>
      </g>

      <path d="M34 308H616" stroke="#203f54"/>
      <text x="34" y="326" fill="#69879a" font-size="12" letter-spacing="1.1">REQUIREMENT → CONTROL → EVIDENCE → DECISION → REMEDIATION</text>
    </g>
  </g>
