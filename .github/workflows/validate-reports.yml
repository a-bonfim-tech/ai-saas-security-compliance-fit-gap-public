name: Validate Reports

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@11.8.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Generate reports
        run: pnpm analyze

      - name: Validate generated report files
        run: |
          test -f reports/fit-gap-analysis.md
          test -f reports/json/fit-gap-analysis.json
          test -f reports/csv/fit-gap-analysis.csv
          node -e "JSON.parse(require('fs').readFileSync('reports/json/fit-gap-analysis.json', 'utf8'))"
