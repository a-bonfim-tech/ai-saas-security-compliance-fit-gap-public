name: Remote Evidence Manual Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@11.2.2 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Collect local evidence
        run: pnpm collect:github-local

      - name: Run fit-gap analysis
        run: pnpm analyze

      - name: Validate reports
        run: |
          test -f evidence/github/github-local-evidence.json
          test -f reports/fit-gap-analysis.md
          test -f reports/json/fit-gap-analysis.json
          test -f reports/csv/fit-gap-analysis.csv
